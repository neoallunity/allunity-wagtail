events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    gzip on; gzip_vary on; gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/xml+rss application/json image/svg+xml;
    limit_req_zone $binary_remote_addr zone=main:10m rate=10r/s;
    upstream app { server web:8000; }
    server {
        listen 80;
        server_name allunity.ru www.allunity.ru;
        return 301 https://$server_name$request_uri;
    }
    server {
        listen 443 ssl http2;
        server_name allunity.ru www.allunity.ru;
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        client_max_body_size 50M;
        location / {
            limit_req zone=main burst=20 nodelay;
            proxy_pass http://app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
        }
        location /static/ { alias /app/static_collected/; expires 1y; add_header Cache-Control "public, immutable"; }
        location /media/ { alias /app/media/; expires 1M; add_header Cache-Control "public"; }
        location ~ /\.ht { deny all; }
    }
}
