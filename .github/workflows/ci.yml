name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt
          pip install beautifulsoup4
      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: allunity.settings.development
          SECRET_KEY: ci-insecure-key-for-tests-only
        run: python manage.py check
      - name: Migrations up to date
        env:
          DJANGO_SETTINGS_MODULE: allunity.settings.development
          SECRET_KEY: ci-insecure-key-for-tests-only
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: allunity.settings.development
          SECRET_KEY: ci-insecure-key-for-tests-only
        run: python manage.py test apps
      - name: Content migration is reproducible
        env:
          DJANGO_SETTINGS_MODULE: allunity.settings.development
          SECRET_KEY: ci-insecure-key-for-tests-only
        run: |
          python manage.py migrate
          python manage.py migrate_data
          python manage.py shell -c "
          from wagtail.models import Page
          from apps.news.models import NewsPage
          from apps.projects.models import ProjectPage
          assert Page.objects.live().count() >= 15, Page.objects.live().count()
          assert NewsPage.objects.live().count() == 4
          assert ProjectPage.objects.live().count() == 5
          print('migration OK: total', Page.objects.live().count(), '| news', NewsPage.objects.live().count(), '| projects', ProjectPage.objects.live().count())
          "
