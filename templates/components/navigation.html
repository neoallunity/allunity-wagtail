{% load wagtailcore_tags static wagtailimages_tags %}
<nav class="bg-white shadow-lg border-b border-gray-200" x-data="{ mobileMenuOpen: false }" aria-label="Основная навигация">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <a href="{% slugurl 'home' %}" class="flex-shrink-0 flex items-center">
                    <img class="h-10 w-auto rounded-full" src="{% static 'images/logo.svg' %}" alt="AllUnity">
                    <span class="ml-3 font-bold text-xl text-gray-900">AllUnity</span>
                </a>
            </div>
            <div class="hidden md:flex md:items-center md:space-x-8">
                {% for menuitem in site_root.get_children.live.in_menu %}
                    <a href="{% pageurl menuitem %}"
                       class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium transition-colors
                              {% if menuitem.id == page.id or menuitem.id in page.get_ancestors %}text-blue-600 bg-blue-50{% endif %}">
                        {{ menuitem.title }}
                    </a>
                {% endfor %}
                <form action="{% slugurl 'search' %}" method="get" class="ml-4" role="search" aria-label="Поиск по сайту">
                    <input type="text" name="q" placeholder="Поиск…"
                           class="w-32 px-3 py-1.5 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                </form>
            </div>
            <div class="md:hidden flex items-center">
                <button @click="mobileMenuOpen = !mobileMenuOpen" class="text-gray-700 hover:text-blue-600 focus:outline-none">
                    <svg x-show="!mobileMenuOpen" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
                    <svg x-show="mobileMenuOpen" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
        </div>
    </div>
    <div x-show="mobileMenuOpen" class="md:hidden">
        <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3 bg-gray-50">
            {% for menuitem in site_root.get_children.live.in_menu %}
                <a href="{% pageurl menuitem %}"
                   class="text-gray-700 hover:text-blue-600 block px-3 py-2 rounded-md text-base font-medium
                          {% if menuitem.id == page.id %}text-blue-600 bg-blue-50{% endif %}">{{ menuitem.title }}</a>
            {% endfor %}
        </div>
    </div>
</nav>
