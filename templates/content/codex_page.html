{% extends "base.html" %}
{% load wagtailcore_tags %}
{% block content %}
<section class="py-16">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-4xl font-bold text-gray-900 mb-4">{{ page.title }}</h1>
    {% if page.preamble %}<div class="prose max-w-none mb-10">{{ page.preamble|richtext }}</div>{% endif %}
    <div class="space-y-8">
      {% for article in page.articles %}
        <article class="p-6 bg-white rounded-xl shadow">
          <h2 class="text-2xl font-semibold text-gray-900 mb-3">{{ article.value.title }}</h2>
          <div class="prose max-w-none text-gray-700">{{ article.value.content }}</div>
        </article>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
