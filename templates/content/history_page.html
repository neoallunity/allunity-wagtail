{% extends "base.html" %}
{% load wagtailcore_tags %}
{% block content %}
<section class="py-16">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-4xl font-bold text-gray-900 mb-8">{{ page.title }}</h1>
    <ol class="relative border-l-2 border-blue-200 ml-3 space-y-8">
      {% for event in page.timeline %}
        <li class="ml-6">
          <span class="absolute -left-[9px] flex w-4 h-4 bg-blue-500 rounded-full"></span>
          <time class="text-sm font-semibold text-blue-600">{{ event.value.date }}</time>
          <h3 class="text-xl font-semibold text-gray-900 mt-1">{{ event.value.title }}</h3>
          <div class="prose max-w-none text-gray-700 mt-1">{{ event.value.description }}</div>
        </li>
      {% endfor %}
    </ol>
  </div>
</section>
{% endblock %}
