<div class="my-12">{% if value.title %}<h3 class="text-2xl font-bold mb-4">{{ value.title }}</h3>{% endif %}
    <div class="relative bg-black rounded-lg overflow-hidden" style="aspect-ratio: 16/9;">
        <iframe src="{{ value.video_url }}" class="absolute inset-0 w-full h-full" frameborder="0" allowfullscreen></iframe>
    </div>
    {% if value.description %}<p class="mt-4 text-gray-600">{{ value.description }}</p>{% endif %}
</div>
